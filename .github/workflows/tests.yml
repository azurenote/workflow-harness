name: tests

# This repo shipped with NO CI. The e40d5a1 regression — a template sync that
# dropped 11 CLI subcommands and broke config.py's public API — survived seven
# months precisely because nothing ran these tests on a change. This workflow is
# the gate that makes that class of regression fail loud, on every push and PR.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests -q
