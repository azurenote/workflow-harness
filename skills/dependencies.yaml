# skills/dependencies.yaml — 이 스킬셋이 기대는 외부 도구의 단일 선언.
#
# 왜 한 곳인가: 전제가 README·install-skills.sh·스킬 본문에 따로 적히면 세 사본이
# 갈라진다. 여기가 정본이고, README 표는 여기서 파생되며 tests/test_skill_docs.py 가
# 둘의 일치를 단언한다. 표를 손으로 고치면 테스트가 깨진다 — 그게 의도다.
#
# 전제는 축이 둘이다. 둘을 섞지 말 것:
#
#   presence — 이 머신에 설치되어 있는가. 기계가 확인할 수 있다.
#              install-skills.sh 가 보는 유일한 축이다.
#   probe    — 지금 실행 중인 주체가 실제로 쓸 수 있는가. 설치 여부와 별개다.
#              같은 머신이라도 호스트(터미널 Claude Code / Desktop / Codex / CI)에
#              따라 갈리며, 설치 스크립트는 이걸 답할 수 없다. 실행 시점에
#              에이전트가 관찰해야 하는 것을 산문으로 적는다.
#
# `presence` 통과가 `probe` 통과를 뜻하지 않는다. 스킬은 도구가 없을 때가 아니라
# **쓸 수 없을 때**도 degrade 경로로 내려가야 한다.
#
# requirement 의미:
#   required — 스킬이 문서화한 **기본 경로**가 이 도구를 쓴다. 없어도 폴백으로
#              절차는 끝까지 간다. 워크플로우를 막는 게이트가 아니다.
#   optional — 있으면 리뷰/탐색 품질이 올라간다. 없어도 기본 경로가 성립한다.
#
# 스키마는 의도적으로 평평하다(스칼라 값만). install-skills.sh 가 YAML 파서 없이
# awk 로 읽어야 하기 때문이다. 중첩 리스트를 넣지 말 것 — 쉼표 구분 문자열을 쓴다.

schema: 1

tools:
  - id: code-review@claude-plugins-official
    kind: claude-plugin
    requirement: required
    presence: installed_plugins
    install: claude plugin install code-review@claude-plugins-official
    probe: "이 세션의 사용 가능한 스킬 목록에 `code-review` 가 보이는가"
    degrades: "리뷰가 1급 도구 경로를 잃는다. 메인 에이전트가 역할별 적대적 리뷰를 직접 수행하는 폴백으로 내려가며 리뷰 자체는 중단되지 않는다."
    used_by: project-start, project-plan, project-iterate
  - id: pr-review-toolkit@claude-plugins-official
    kind: claude-plugin
    requirement: optional
    presence: installed_plugins
    install: claude plugin install pr-review-toolkit@claude-plugins-official
    probe: "이 세션의 에이전트 목록에 `pr-review-toolkit:*` 역할 에이전트가 보이는가"
    degrades: "역할별 전문 리뷰어(침묵 실패·타입 설계·테스트 커버리지)를 못 쓴다. 기본 3역할 리뷰로 수행한다."
    used_by: project-start, project-done
  - id: security-guidance@claude-plugins-official
    kind: claude-plugin
    requirement: optional
    presence: installed_plugins
    install: claude plugin install security-guidance@claude-plugins-official
    probe: "이 세션의 사용 가능한 스킬 목록에 `security-review` 가 보이는가"
    degrades: "보안 관점이 구현자 역할 리뷰에 흡수된다. 별도 보안 패스가 없다."
    used_by: project-start
  - id: ENABLE_LSP_TOOL
    kind: env-flag
    requirement: optional
    presence: env
    install: export ENABLE_LSP_TOOL=1
    probe: "LSP 도구 호출이 심볼 정의·참조를 실제로 반환하는가(빈 결과와 미가용을 구분할 것)"
    degrades: "중복 탐색이 구조 기반에서 텍스트 기반으로 내려간다. Grep/Glob 만으로 수행하고, 구조적 중복을 놓쳤을 수 있음을 플랜에 남긴다."
    used_by: project-plan
  - id: language-lsp@claude-plugins-official
    kind: claude-plugin-group
    requirement: optional
    presence: installed_plugins_any
    members: rust-analyzer-lsp@claude-plugins-official, typescript-lsp@claude-plugins-official, pyright-lsp@claude-plugins-official
    install: claude plugin install rust-analyzer-lsp@claude-plugins-official
    probe: "대상 프로젝트 언어에 맞는 멤버가 켜져 있는가 — 다른 언어 멤버가 설치돼 있어도 이 프로젝트에서는 무의미하다"
    degrades: "`ENABLE_LSP_TOOL` 이 켜져 있어도 해당 언어의 심볼 질의가 되지 않는다. 텍스트 기반 탐색으로 내려간다."
    used_by: project-plan
