[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-core"
version = "0.1.0"
description = "Claude Code workflow automation — shared core modules"
requires-python = ">=3.11"

[project.scripts]
harness-init = "harness_core.scaffold:main_init"
harness-update = "harness_core.scaffold:main_update"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/harness_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
